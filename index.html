<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NS 3D Atölye</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
  slate: { 50:'#f7f4ee',100:'#efe9dd',200:'#e2dacb',300:'#cfc6b4',400:'#a8a095',500:'#7a746b',600:'#5c5750',700:'#44403b',800:'#2f2c29',900:'#242220',950:'#1a1918' },
  indigo: { 500:'#7d7468',600:'#5f574d' } } } } }</script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  .fade { animation: f .15s ease-out } @keyframes f { from { opacity:0; transform: translateY(6px) } to { opacity:1 } }
  .inp { width:100%; border-radius:.75rem; border:1px solid #d8cfbf; background:transparent; padding:.5rem .75rem; font-size:.875rem; outline:none }
  .inp:focus { border-color:#7d7468; box-shadow:0 0 0 2px #7d746833 }
  .dark .inp { border-color:#44403b } .dark .inp option { background:#242220 }
  .btn { border-radius:.75rem; padding:.5rem 1rem; font-size:.875rem; font-weight:600; transition:.15s }
  body.viewer #dataBtn, body.viewer [onclick*="Form("], body.viewer [onclick*="delItem"], body.viewer [onclick*="unsell"], body.viewer [onclick*="pickSale"], body.viewer [onclick*="toggleSample"] { display:none !important }
  .btn-p { background:#5f574d; color:#fff } .btn-p:hover { background:#4a443c }
  .btn-s { border:1px solid #d8cfbf } .dark .btn-s { border-color:#44403b } .btn-s:hover { background:#7d74681a }
  .btn-d { color:#ef4444; border:1px solid #ef444455 } .btn-d:hover { background:#ef44441a }
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

<header class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="font-bold text-lg tracking-tight whitespace-nowrap">NS 3D Atölye</div>
    <nav id="tabs" class="flex-1 flex gap-1 overflow-x-auto sm:justify-center"></nav>
    <div class="flex gap-1">
      <button id="themeBtn" class="btn btn-s" title="Tema">Tema</button>
      <button id="dataBtn" class="btn btn-s" title="Yedekle / Geri yükle">Yedek</button>
    </div>
  </div>
</header>

<main id="main" class="max-w-6xl mx-auto px-4 py-6"></main>

<div id="modalRoot"></div>

<script>
/* ---------- Depolama ---------- */
// Anahtar sabit kalmalı: sayfa güncellense de veriler aynı anahtardan okunur.
const KEY = 'atolye_v1';
const defaults = () => ({ designs: [], samples: [], posts: [], contact: { note: '', items: [] } });
// Yerel dosyada veya #admin ile açılınca yönetici; yayındaki ziyaretçiler salt okunur görür.
if (location.hash === '#admin') localStorage.setItem('atolye_admin', '1');
if (location.hash === '#viewer') localStorage.removeItem('atolye_admin');
const isAdmin = location.protocol === 'file:' || localStorage.getItem('atolye_admin') === '1';
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    return Object.assign(defaults(), d || {}); // yeni alanlar eklense de eski veri korunur
  } catch { return defaults(); }
}
let db = load();
const save = () => { localStorage.setItem(KEY, JSON.stringify(db)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- Yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const safeUrl = u => /^(https?:\/\/|data:image\/)/i.test(u || '') ? esc(u) : '';
const PH = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#94a3b8" fill-opacity=".25"/><text x="50%" y="50%" text-anchor="middle" fill="#a8a095" font-size="28">NS 3D</text></svg>');
const img = u => safeUrl(u) || PH;
const stars = (n, cls = '') => `<span class="${cls} text-amber-400">${'★'.repeat(n || 0)}<span class="text-slate-300 dark:text-slate-600">${'★'.repeat(5 - (n || 0))}</span></span>`;
const fmtG = g => g >= 1000 ? (g / 1000).toFixed(2).replace(/\.?0+$/, '') + ' kg' : g + ' g';
const money = p => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(p || 0);
const ytId = u => { const m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; };
const sampleName = id => { const s = db.samples.find(x => x.id === id); return s ? `${s.brand} ${s.color} ${s.type}`.trim() : ''; };
const total = s => (+s.stock || 0) + (+s.packs || 0) * 1000; // her kapalı paket +1000 g
const mainImg = d => d.images?.[d.mainIdx] || d.images?.[0];

/* ---------- Modal ---------- */
function openModal(html, wide) {
  closeModal();
  $('#modalRoot').innerHTML = `<div id="ov" class="fixed inset-0 z-50 bg-black/60 flex items-start sm:items-center justify-center p-3 overflow-y-auto">
    <div class="fade bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full ${wide ? 'max-w-4xl' : 'max-w-xl'} my-4 relative border border-slate-200 dark:border-slate-800">
      <button onclick="closeModal()" class="absolute right-3 top-3 w-8 h-8 rounded-full hover:bg-slate-500/20 z-10">✕</button>
      <div class="p-5 sm:p-6">${html}</div></div></div>`;
  $('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModal(); });
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Görsel düzenleyici (form içi) ---------- */
let fImgs = [], fMain = 0;
function imgEditor(label = 'Görseller') {
  return `<div><label class="block text-sm font-medium mb-1">${label}</label>
    <div class="flex gap-2"><input id="imgUrl" class="inp" placeholder="Resim URL'si yapıştırın">
    <button type="button" class="btn btn-s" onclick="addImgUrl()">Ekle</button></div>
    <label class="btn btn-s inline-block mt-2 cursor-pointer text-xs">Dosyadan yükle
      <input type="file" accept="image/*" multiple class="hidden" onchange="addImgFiles(this.files)"></label>
    <div id="imgList" class="flex flex-wrap gap-2 mt-2"></div>
    <p class="text-xs text-slate-500 mt-1">Yıldıza tıklayarak ana resmi seçin.</p></div>`;
}
function drawImgs() {
  const el = $('#imgList'); if (!el) return;
  el.innerHTML = fImgs.map((u, i) => `<div class="relative w-20 h-20 rounded-lg overflow-hidden border-2 ${i === fMain ? 'border-amber-400' : 'border-transparent'}">
    <img src="${img(u)}" class="w-full h-full object-cover">
    <button type="button" onclick="fMain=${i};drawImgs()" class="absolute left-0 top-0 bg-black/60 text-xs px-1 ${i === fMain ? 'text-amber-400' : 'text-white'}">★</button>
    <button type="button" onclick="fImgs.splice(${i},1);fMain=0;drawImgs()" class="absolute right-0 top-0 bg-black/60 text-white text-xs px-1">✕</button></div>`).join('');
}
function addImgUrl() {
  const i = $('#imgUrl'), v = i.value.trim();
  if (!safeUrl(v)) return alert('Geçerli bir http(s) resim adresi girin.');
  fImgs.push(v); i.value = ''; drawImgs();
}
function addImgFiles(files) {
  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      fImgs.push(c.toDataURL('image/jpeg', .75)); drawImgs();
    }; im.src = r.result; };
    r.readAsDataURL(f);
  });
}

/* ---------- Sekmeler ---------- */
const TABS = [['vitrin', 'Vitrin'], ['numune', 'Numuneler'], ['tecrube', 'Tecrübelerimiz'], ['satis', '🛒 Satış'], ['iletisim', 'İletişim']];
let tab = localStorage.getItem('atolye_tab') || 'vitrin';
let designQ = '';
const sf = { stock: 'all', sort: 'none' };

function render() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button onclick="setTab('${k}')" class="btn whitespace-nowrap ${tab === k ? 'btn-p' : 'hover:bg-indigo-500/10'}">${l}</button>`).join('');
  $('#main').innerHTML = `<div class="fade">${{ vitrin: vVitrin, numune: vNumune, tecrube: vTecrube, satis: vSatis, iletisim: vIletisim }[tab]()}</div>`;
}
function setTab(t) { tab = t; localStorage.setItem('atolye_tab', t); render(); }

const head = (title, btn) => `<div class="flex flex-wrap items-center justify-between gap-3 mb-5"><h2 class="text-2xl font-bold">${title}</h2>${btn}</div>`;
const empty = t => `<div class="text-center py-16 text-slate-500 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl">${t}</div>`;

/* ---------- 1) Vitrin ---------- */
function designCard(d) {
  return `<article onclick="showDesign('${d.id}')" class="cursor-pointer group bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 hover:shadow-xl hover:-translate-y-0.5 transition">
    <div class="aspect-[4/3] overflow-hidden relative"><img src="${img(mainImg(d))}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
    ${d.forSale ? `<span class="absolute top-2 right-2 bg-emerald-500 text-white text-xs font-semibold px-2 py-1 rounded-full">Satılık</span>` : ''}</div>
    <div class="p-4"><h3 class="font-semibold">${esc(d.name)}</h3>
    <p class="text-sm text-slate-500 line-clamp-2 mt-1">${esc(d.desc)}</p>
    <div class="flex flex-wrap gap-1 mt-3">${(d.tags || []).map(t => `<span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">${esc(t)}</span>`).join('')}</div></div></article>`;
}
function vVitrin() {
  const q = designQ.toLowerCase();
  const list = db.designs.filter(d => !q || (d.name + d.desc + (d.tags || []).join(' ')).toLowerCase().includes(q));
  return head('Vitrin', `<div class="flex gap-2 flex-1 sm:flex-none justify-end">
    <input class="inp sm:w-56" placeholder="Ara..." value="${esc(designQ)}" oninput="designQ=this.value;renderGrid()">
    <button class="btn btn-p whitespace-nowrap" onclick="designForm()">+ Yeni Tasarım Ekle</button></div>`)
    + `<div id="grid">${gridHtml(list)}</div>`;
}
function gridHtml(list) {
  return list.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">${list.map(designCard).join('')}</div>` : empty('Henüz tasarım yok. "Yeni Tasarım Ekle" ile başlayın.');
}
function renderGrid() {
  const q = designQ.toLowerCase();
  $('#grid').innerHTML = gridHtml(db.designs.filter(d => !q || (d.name + d.desc + (d.tags || []).join(' ')).toLowerCase().includes(q)));
}
function showDesign(id, idx) {
  const d = db.designs.find(x => x.id === id); if (!d) return;
  const imgs = d.images?.length ? d.images : [null];
  const cur = idx ?? (d.mainIdx || 0);
  const row = (k, v) => v || v === 0 ? `<div class="flex justify-between gap-3 py-2 border-b border-slate-200 dark:border-slate-800 text-sm"><span class="text-slate-500">${k}</span><span class="font-medium text-right">${v}</span></div>` : '';
  const s = db.samples.find(x => x.id === d.sampleId);
  openModal(`<div class="grid md:grid-cols-2 gap-6">
    <div><img src="${img(imgs[cur])}" class="w-full aspect-[4/3] object-cover rounded-xl">
      <div class="flex gap-2 mt-2 overflow-x-auto">${imgs.map((u, i) => `<img src="${img(u)}" onclick="showDesign('${id}',${i})" class="w-16 h-16 object-cover rounded-lg cursor-pointer border-2 ${i === cur ? 'border-indigo-500' : 'border-transparent opacity-70'}">`).join('')}</div></div>
    <div><h3 class="text-xl font-bold pr-8">${esc(d.name)}</h3>
      <p class="text-sm text-slate-500 mt-2 whitespace-pre-line">${esc(d.desc)}</p>
      <div class="flex flex-wrap gap-1 mt-3">${(d.tags || []).map(t => `<span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">${esc(t)}</span>`).join('')}</div>
      <div class="mt-4">${row('Çizim / dilimleme yazılımı', esc(d.software))}
        ${row('Filament', s ? `<a href="#" class="text-indigo-500 underline" onclick="event.preventDefault();openSampleFromDesign('${s.id}')">${esc(sampleName(s.id))}</a>` : esc(d.filamentText))}
        ${row('Baskı süresi', d.hours ? d.hours + ' saat' : '')}${row('Ağırlık', d.grams ? d.grams + ' g' : '')}
        ${row('Satış', d.forSale ? `<span class="text-emerald-500">${money(d.price)}</span>` : 'Satılık değil')}</div>
      <div class="flex flex-wrap gap-2 mt-5">
        <button class="btn btn-p" onclick="saleForm('${id}')">${d.forSale ? '💲 Fiyatı Düzenle' : '🛒 Satışa Çıkar'}</button>
        ${d.forSale ? `<button class="btn btn-s" onclick="unsell('${id}')">Satıştan Kaldır</button>` : ''}
        <button class="btn btn-s" onclick="designForm('${id}')">Düzenle</button>
        <button class="btn btn-d" onclick="delItem('designs','${id}')">Sil</button></div></div></div>`, true);
}
function designForm(id) {
  const d = db.designs.find(x => x.id === id) || { name: '', desc: '', tags: [], images: [], mainIdx: 0 };
  fImgs = [...(d.images || [])]; fMain = d.mainIdx || 0;
  openModal(`<h3 class="text-xl font-bold mb-4">${id ? 'Tasarımı Düzenle' : 'Yeni Tasarım Ekle'}</h3>
  <form id="f" class="space-y-3" onsubmit="event.preventDefault();saveDesign('${id || ''}')">
    <div><label class="text-sm font-medium">Ad *</label><input name="name" required class="inp" value="${esc(d.name)}"></div>
    <div><label class="text-sm font-medium">Açıklama</label><textarea name="desc" rows="3" class="inp">${esc(d.desc)}</textarea></div>
    <div><label class="text-sm font-medium">Etiketler (virgülle)</label><input name="tags" class="inp" value="${esc((d.tags || []).join(', '))}"></div>
    ${imgEditor('Resimler')}
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-sm font-medium">Yazılım</label><input name="software" class="inp" placeholder="Fusion 360, Bambu Studio..." value="${esc(d.software)}"></div>
      <div><label class="text-sm font-medium">Numune (filament)</label><select name="sampleId" class="inp"><option value="">— seçilmedi —</option>
        ${db.samples.map(s => `<option value="${s.id}" ${s.id === d.sampleId ? 'selected' : ''}>${esc(sampleName(s.id))}</option>`).join('')}</select></div>
      <div><label class="text-sm font-medium">Filament (serbest metin)</label><input name="filamentText" class="inp" placeholder="Numune yoksa" value="${esc(d.filamentText)}"></div>
      <div><label class="text-sm font-medium">Süre (saat)</label><input name="hours" type="number" step="0.1" min="0" class="inp" value="${d.hours ?? ''}"></div>
      <div><label class="text-sm font-medium">Gram</label><input name="grams" type="number" step="0.1" min="0" class="inp" value="${d.grams ?? ''}"></div>
    </div>
    <div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button><button class="btn btn-p">Kaydet</button></div>
  </form>`);
  drawImgs();
}
function saveDesign(id) {
  const f = new FormData($('#f')), o = Object.fromEntries(f);
  const data = { name: o.name.trim(), desc: o.desc.trim(), tags: o.tags.split(',').map(t => t.trim()).filter(Boolean),
    images: [...fImgs], mainIdx: Math.min(fMain, Math.max(fImgs.length - 1, 0)), software: o.software.trim(), sampleId: o.sampleId,
    filamentText: o.filamentText.trim(), hours: o.hours === '' ? null : +o.hours, grams: o.grams === '' ? null : +o.grams };
  const ex = db.designs.find(x => x.id === id);
  if (ex) Object.assign(ex, data); else db.designs.unshift({ id: uid(), forSale: false, price: 0, ...data });
  save(); closeModal(); render();
}

/* ---------- Satış yönetimi ---------- */
function saleForm(id) {
  const d = db.designs.find(x => x.id === id);
  openModal(`<h3 class="text-xl font-bold mb-4">Satış Fiyatı — ${esc(d.name)}</h3>
  <form class="space-y-3" onsubmit="event.preventDefault();setSale('${id}',+this.price.value)">
    <div><label class="text-sm font-medium">Satış fiyatı (₺)</label><input name="price" type="number" min="0" step="0.01" required class="inp" value="${d.price || ''}"></div>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button><button class="btn btn-p">Satışa Çıkar</button></div></form>`);
}
function setSale(id, price) { const d = db.designs.find(x => x.id === id); d.forSale = true; d.price = price; save(); closeModal(); render(); }
function unsell(id) { const d = db.designs.find(x => x.id === id); d.forSale = false; save(); closeModal(); render(); }
function pickSale() {
  const l = db.designs.filter(d => !d.forSale);
  openModal(`<h3 class="text-xl font-bold mb-4">Vitrinden ürün seç</h3>` + (l.length ? `<div class="space-y-2">${l.map(d => `
    <button onclick="saleForm('${d.id}')" class="w-full flex items-center gap-3 p-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-indigo-500/10 text-left">
    <img src="${img(mainImg(d))}" class="w-14 h-14 rounded-lg object-cover"><span class="font-medium">${esc(d.name)}</span></button>`).join('')}</div>` : empty('Satışa çıkarılacak ürün kalmadı.')));
}
function vSatis() {
  const l = db.designs.filter(d => d.forSale);
  return head('Satılık Tasarımlar', `<button class="btn btn-p" onclick="pickSale()">+ Satışa Ürün Ekle</button>`) +
    (l.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${l.map(d => `
    <div class="flex gap-4 bg-white dark:bg-slate-900 rounded-2xl p-3 border border-slate-200 dark:border-slate-800">
      <img src="${img(mainImg(d))}" onclick="showDesign('${d.id}')" class="w-32 h-32 sm:w-40 sm:h-40 object-cover rounded-xl cursor-pointer">
      <div class="flex-1 flex flex-col"><h3 class="font-semibold">${esc(d.name)}</h3>
      <p class="text-sm text-slate-500 line-clamp-3 mt-1">${esc(d.desc)}</p>
      <div class="mt-auto flex items-center justify-between pt-2"><span class="text-xl font-bold text-emerald-500">${money(d.price)}</span>
      <span class="flex gap-1"><button class="btn btn-s text-xs" onclick="saleForm('${d.id}')">Fiyat</button><button class="btn btn-s text-xs" onclick="unsell('${d.id}')">Kaldır</button></span></div></div></div>`).join('')}</div>`
      : empty('Şu an satılık ürün yok.'));
}

/* ---------- 2) Numuneler ---------- */
function vNumune() {
  let l = [...db.samples];
  if (sf.stock === 'gt1000') l = l.filter(s => total(s) > 1000);
  if (sf.stock === 'low') l = l.filter(s => total(s) < 250);
  if (sf.stock === 'active') l = l.filter(s => s.status === 'active');
  if (sf.stock === 'done') l = l.filter(s => s.status === 'done');
  const [k, dir] = sf.sort.split('-');
  if (sf.sort !== 'none') l.sort((a, b) => ((k === 'stock' ? total(a) : a[k] || 0) - (k === 'stock' ? total(b) : b[k] || 0)) * (dir === 'asc' ? 1 : -1));
  const o = (v, t, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`;
  return head('Filament Numuneleri', `<button class="btn btn-p" onclick="sampleForm()">+ Yeni Numune</button>`) +
    `<div class="flex flex-wrap gap-2 mb-5">
      <select class="inp w-auto" onchange="sf.stock=this.value;render()">${o('all', 'Tüm stoklar', sf.stock)}${o('gt1000', '1 kg üzeri', sf.stock)}${o('low', 'Az kalanlar (<250 g)', sf.stock)}${o('active', 'Devam edenler', sf.stock)}${o('done', 'Bitenler', sf.stock)}</select>
      <select class="inp w-auto" onchange="sf.sort=this.value;render()">${o('none', 'Sıralama', sf.sort)}${o('stock-asc', 'Stok: azdan çoğa', sf.sort)}${o('stock-desc', 'Stok: çoktan aza', sf.sort)}${o('rating-desc', 'Puan: yüksekten düşüğe', sf.sort)}${o('rating-asc', 'Puan: düşükten yükseğe', sf.sort)}</select></div>` +
    (l.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${l.map(s => `
    <div onclick="showSample('${s.id}')" class="cursor-pointer bg-white dark:bg-slate-900 rounded-2xl p-3 flex gap-3 border border-slate-200 dark:border-slate-800 hover:shadow-lg transition">
      <img src="${img(s.img)}" class="w-20 h-20 rounded-xl object-cover">
      <div class="flex-1 min-w-0 text-sm"><div class="font-semibold truncate">${esc(s.brand)} — ${esc(s.type)}</div>
        <div class="text-slate-500">${esc(s.color)}${s.spool ? ' • Bobin: ' + s.spool + ' g' : ''}</div>
        <div>Stok: <b>${fmtG(total(s))}</b> ${total(s) < 250 && s.status !== 'done' ? '<span class="text-red-500 text-xs">az</span>' : ''}</div>
        ${s.packs > 0 ? `<div class="text-xs text-slate-500">Açık: ${fmtG(s.stock)} + ${s.packs} açılmamış paket</div>` : ''}
        <div class="text-slate-500 text-xs">SKT: ${esc(s.expiry) || '-'}</div>
        <div class="flex items-center justify-between mt-1">${stars(s.rating)}
          <span class="text-xs px-2 py-0.5 rounded-full ${s.status === 'done' ? 'bg-slate-500/20' : 'bg-emerald-500/20 text-emerald-500'}">${s.status === 'done' ? 'Bitti' : 'Devam ediyor'}</span></div>
        <div class="flex gap-1 mt-2" onclick="event.stopPropagation()">
          <button class="btn btn-s text-xs !py-1" onclick="toggleSample('${s.id}')">${s.status === 'done' ? 'Devam ediyor yap' : 'Bitti yap'}</button>
          <button class="btn btn-s text-xs !py-1" onclick="sampleForm('${s.id}')">Düzenle</button></div></div></div>`).join('')}</div>` : empty('Numune bulunamadı.')) +
    '';
}
function openSampleFromDesign(id) { setTab('numune'); showSample(id); }
function showSample(id) {
  const s = db.samples.find(x => x.id === id); if (!s) return;
  openModal(`<div class="flex gap-4"><img src="${img(s.img)}" class="w-28 h-28 rounded-xl object-cover">
    <div class="text-sm"><h3 class="text-xl font-bold pr-8">${esc(sampleName(id))}</h3>
      <div class="text-slate-500 mt-1">Toplam stok: <b>${fmtG(total(s))}</b>${s.packs > 0 ? ` (açık ${fmtG(s.stock)} + ${s.packs} paket)` : ''}</div>
      <div class="text-slate-500">SKT: ${esc(s.expiry) || '-'} • ${s.status === 'done' ? 'Bitti' : 'Devam ediyor'}</div>${stars(s.rating)}</div></div>
    <button id="showPrinted" class="btn btn-p mt-5" onclick="showPrinted('${id}')">Basılan ürünleri göster</button><div id="printed" class="mt-4"></div>`, true);
}
function showPrinted(id) {
  $('#showPrinted').remove();
  $('#printed').innerHTML = gridHtml(db.designs.filter(d => d.sampleId === id)).replace('Henüz tasarım yok. "Yeni Tasarım Ekle" ile başlayın.', 'Bu filamentle basılmış ürün eklenmemiş.');
}
function toggleSample(id) { const s = db.samples.find(x => x.id === id); s.status = s.status === 'done' ? 'active' : 'done'; save(); render(); }
let fRating = 0;
function sampleForm(id) {
  const s = db.samples.find(x => x.id === id) || { brand: '', spool: '', color: '', type: 'PLA', stock: 1000, packs: 0, expiry: '', status: 'active', rating: 0 };
  fImgs = s.img ? [s.img] : []; fMain = 0; fRating = s.rating || 0;
  openModal(`<h3 class="text-xl font-bold mb-4">${id ? 'Numuneyi Düzenle' : 'Yeni Numune'}</h3>
  <form id="f" class="space-y-3" onsubmit="event.preventDefault();saveSample('${id || ''}')">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-sm font-medium">Marka *</label><input name="brand" required class="inp" value="${esc(s.brand)}"></div>
      <div><label class="text-sm font-medium">Bobin gramajı (gr)</label><input name="spool" type="number" min="0" class="inp" placeholder="1000" value="${s.spool ?? ''}"></div>
      <div><label class="text-sm font-medium">Renk</label><input name="color" class="inp" value="${esc(s.color)}"></div>
      <div><label class="text-sm font-medium">Tür</label><input name="type" class="inp" placeholder="PLA, PETG..." value="${esc(s.type)}"></div>
      <div><label class="text-sm font-medium">Açık bobin stoğu (gram)</label><input name="stock" type="number" min="0" required class="inp" value="${s.stock}"></div>
      <div><label class="text-sm font-medium">Açılmamış paket (adet, +1000 g)</label><input name="packs" type="number" min="0" step="1" class="inp" value="${s.packs || 0}"></div>
      <div><label class="text-sm font-medium">SKT</label><input name="expiry" class="inp" placeholder="örn. 2027-05 veya parti no" value="${esc(s.expiry)}"></div>
      <div><label class="text-sm font-medium">Durum</label><select name="status" class="inp"><option value="active" ${s.status !== 'done' ? 'selected' : ''}>Devam ediyor</option><option value="done" ${s.status === 'done' ? 'selected' : ''}>Bitti</option></select></div>
      <div><label class="text-sm font-medium">Puan</label><div id="rate" class="text-2xl cursor-pointer select-none"></div></div></div>
    ${imgEditor('Numune görseli (ilk resim kullanılır)')}
    <div class="flex justify-between pt-2"><div>${id ? `<button type="button" class="btn btn-d" onclick="delItem('samples','${id}')">Sil</button>` : ''}</div>
    <div class="flex gap-2"><button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button><button class="btn btn-p">Kaydet</button></div></div>
  </form>`);
  drawImgs(); drawRate();
}
function drawRate() {
  $('#rate').innerHTML = [1, 2, 3, 4, 5].map(i => `<span onclick="fRating=fRating===${i}?0:${i};drawRate()" class="${i <= fRating ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'}">★</span>`).join('');
}
function saveSample(id) {
  const o = Object.fromEntries(new FormData($('#f')));
  const data = { brand: o.brand.trim(), spool: o.spool === '' ? '' : +o.spool, color: o.color.trim(), type: o.type.trim(), stock: +o.stock, packs: Math.max(0, parseInt(o.packs) || 0), expiry: o.expiry.trim(), status: o.status, rating: fRating, img: fImgs[Math.min(fMain, fImgs.length - 1)] || '' };
  const ex = db.samples.find(x => x.id === id);
  if (ex) Object.assign(ex, data); else db.samples.unshift({ id: uid(), ...data });
  save(); closeModal(); render();
}

/* ---------- 3) Tecrübelerimiz ---------- */
function vTecrube() {
  return head('Tecrübelerimiz', `<button class="btn btn-p" onclick="postForm()">+ Yeni Yazı / Vlog</button>`) +
    (db.posts.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">${db.posts.map(p => {
      const y = ytId(p.youtube), cover = p.images?.[p.mainIdx] || p.images?.[0] || (y ? `https://img.youtube.com/vi/${y}/hqdefault.jpg` : '');
      return `<article onclick="showPost('${p.id}')" class="cursor-pointer group bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 hover:shadow-xl transition">
      <div class="aspect-video overflow-hidden relative"><img src="${img(cover)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
      ${y ? '<span class="absolute inset-0 flex items-center justify-center text-5xl text-white drop-shadow">▶</span>' : ''}</div>
      <div class="p-4"><h3 class="font-semibold">${esc(p.title)}</h3><p class="text-sm text-slate-500 line-clamp-3 mt-1">${esc(p.text)}</p>
      <div class="text-xs text-slate-400 mt-2">${new Date(p.date).toLocaleDateString('tr-TR')}</div></div></article>`; }).join('')}</div>` : empty('Henüz yazı yok.'));
}
function showPost(id) {
  const p = db.posts.find(x => x.id === id), y = ytId(p.youtube);
  openModal(`<h3 class="text-xl font-bold pr-8">${esc(p.title)}</h3><div class="text-xs text-slate-400 mb-3">${new Date(p.date).toLocaleDateString('tr-TR')}</div>
    ${y ? `<div class="aspect-video mb-4"><iframe class="w-full h-full rounded-xl" src="https://www.youtube-nocookie.com/embed/${y}" allowfullscreen loading="lazy"></iframe></div>` : ''}
    <p class="whitespace-pre-line text-sm leading-relaxed">${esc(p.text)}</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4">${(p.images || []).map(u => `<img src="${img(u)}" class="rounded-lg w-full aspect-square object-cover">`).join('')}</div>
    <div class="flex gap-2 mt-5"><button class="btn btn-s" onclick="postForm('${id}')">Düzenle</button><button class="btn btn-d" onclick="delItem('posts','${id}')">Sil</button></div>`, true);
}
function postForm(id) {
  const p = db.posts.find(x => x.id === id) || { title: '', text: '', youtube: '', images: [], mainIdx: 0 };
  fImgs = [...(p.images || [])]; fMain = p.mainIdx || 0;
  openModal(`<h3 class="text-xl font-bold mb-4">${id ? 'Yazıyı Düzenle' : 'Yeni Yazı / Vlog'}</h3>
  <form id="f" class="space-y-3" onsubmit="event.preventDefault();savePost('${id || ''}')">
    <div><label class="text-sm font-medium">Başlık *</label><input name="title" required class="inp" value="${esc(p.title)}"></div>
    <div><label class="text-sm font-medium">YouTube bağlantısı</label><input name="youtube" class="inp" placeholder="https://youtu.be/..." value="${esc(p.youtube)}"></div>
    <div><label class="text-sm font-medium">Yazı</label><textarea name="text" rows="6" class="inp">${esc(p.text)}</textarea></div>
    ${imgEditor('Görseller (ana resim = kapak)')}
    <div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button><button class="btn btn-p">Kaydet</button></div>
  </form>`, true);
  drawImgs();
}
function savePost(id) {
  const o = Object.fromEntries(new FormData($('#f')));
  if (o.youtube.trim() && !ytId(o.youtube)) return alert('Geçerli bir YouTube bağlantısı girin.');
  const data = { title: o.title.trim(), youtube: o.youtube.trim(), text: o.text.trim(), images: [...fImgs], mainIdx: Math.min(fMain, Math.max(fImgs.length - 1, 0)) };
  const ex = db.posts.find(x => x.id === id);
  if (ex) Object.assign(ex, data); else db.posts.unshift({ id: uid(), date: Date.now(), ...data });
  save(); closeModal(); render();
}

/* ---------- 5) İletişim ---------- */
function contactVal(v) {
  v = esc(v.trim());
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<a class="underline" href="mailto:${v}">${v}</a>`;
  if (/^https?:\/\//i.test(v)) return `<a class="underline" href="${v}" target="_blank" rel="noopener noreferrer">${v}</a>`;
  return v;
}
function vIletisim() {
  const c = db.contact || { note: '', items: [] };
  return head('İletişim', `<button class="btn btn-p" onclick="contactForm()">Düzenle</button>`) +
    (c.note || c.items.length ? `<div class="max-w-xl bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
      ${c.note ? `<p class="whitespace-pre-line text-sm mb-4">${esc(c.note)}</p>` : ''}
      ${c.items.map(i => `<div class="flex justify-between gap-4 py-2 border-b last:border-0 border-slate-200 dark:border-slate-800 text-sm"><span class="text-slate-500">${esc(i.label)}</span><span class="font-medium text-right break-all">${contactVal(i.value)}</span></div>`).join('')}</div>`
      : empty('İletişim bilgisi henüz eklenmedi.'));
}
function contactForm() {
  const c = db.contact || { note: '', items: [] };
  openModal(`<h3 class="text-xl font-bold mb-4">İletişim Bilgileri</h3>
  <form id="f" class="space-y-3" onsubmit="event.preventDefault();saveContact()">
    <div><label class="text-sm font-medium">Not</label><textarea name="note" rows="2" class="inp">${esc(c.note)}</textarea></div>
    <div><label class="text-sm font-medium">Bilgiler (her satır: Başlık | değer)</label>
      <textarea name="items" rows="5" class="inp" placeholder="Nesli | nesli@ornek.com">${esc(c.items.map(i => i.label + ' | ' + i.value).join('\n'))}</textarea></div>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button><button class="btn btn-p">Kaydet</button></div></form>`);
}
function saveContact() {
  const o = Object.fromEntries(new FormData($('#f')));
  const items = o.items.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf('|'); return i < 0 ? { label: '', value: l } : { label: l.slice(0, i).trim(), value: l.slice(i + 1).trim() }; });
  db.contact = { note: o.note.trim(), items }; save(); closeModal(); render();
}

/* ---------- Silme ---------- */
function delItem(col, id) {
  if (!confirm('Silinsin mi?')) return;
  db[col] = db[col].filter(x => x.id !== id);
  if (col === 'samples') db.designs.forEach(d => { if (d.sampleId === id) d.sampleId = ''; });
  save(); closeModal(); render();
}

/* ---------- Yedek / Geri yükle ---------- */
$('#dataBtn').onclick = () => openModal(`<h3 class="text-xl font-bold mb-2">Veri Yedeği</h3>
  <p class="text-sm text-slate-500 mb-4">Veriler bu tarayıcıda (localStorage) saklanır. Sayfa dosyası güncellense de silinmez; yine de düzenli yedek alın.</p>
  <div class="flex flex-wrap gap-2"><button class="btn btn-p" onclick="exportData('data.json')">Yayın dosyasını indir (data.json)</button>
  <button class="btn btn-s" onclick="exportData()">Yedeği indir</button>
  <label class="btn btn-s cursor-pointer">Yedeği yükle<input type="file" accept=".json" class="hidden" onchange="importData(this.files[0])"></label></div>`);
function exportData(name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }));
  a.download = name || `atolye-yedek-${new Date().toISOString().slice(0, 10)}.json`; a.click();
}
function importData(f) {
  if (!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t);
      if (!['designs', 'samples', 'posts'].every(k => Array.isArray(d[k] ?? []))) throw 0;
      if (!confirm('Mevcut veriler yüklenen yedekle değiştirilecek. Devam?')) return;
      db = Object.assign(defaults(), d); save(); closeModal(); render();
    } catch { alert('Geçersiz yedek dosyası.'); }
  });
}

/* ---------- Tema ---------- */
const applyTheme = () => document.documentElement.classList.toggle('dark', localStorage.getItem('atolye_theme') === 'dark' ||
  (!localStorage.getItem('atolye_theme') && matchMedia('(prefers-color-scheme: dark)').matches));
$('#themeBtn').onclick = () => { localStorage.setItem('atolye_theme', document.documentElement.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); };
document.body.classList.toggle('viewer', !isAdmin);
async function boot() {
  // Yönetici kendi yerel verisini kullanır; diğerleri yayındaki data.json'u okur.
  if (!(isAdmin && localStorage.getItem(KEY))) {
    try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) db = Object.assign(defaults(), await r.json()); } catch {}
  }
  render();
}
applyTheme(); boot();
</script>
</body>
</html>
